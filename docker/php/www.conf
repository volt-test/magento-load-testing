; Small worker pool: Docker Desktop on this machine has ~6.5 GB for every
; container, and a Magento request can hold a few hundred MB. Override with
; PHP_FPM_MAX_CHILDREN for the phase-2 benchmark box.
[www]
listen = 127.0.0.1:9000
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.max_requests = 500
request_terminate_timeout = 300s
catch_workers_output = yes
clear_env = no
